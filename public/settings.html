<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器设置管理 - PC Utility Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            transition: background 0.2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.3);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
        }

        .card-title {
            font-size: 1.5em;
            font-weight: 600;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-hint {
            font-size: 0.85em;
            color: #6b7280;
            margin-top: 5px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-online {
            background: #d1fae5;
            color: #065f46;
        }

        .status-offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        #loginSection {
            max-width: 400px;
            margin: 0 auto;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 服务器设置管理</h1>
        </div>

        <div class="nav">
            <a href="/status">📊 状态监控</a>
            <a href="/settings.html">⚙️ 设置管理</a>
        </div>

        <!-- 登录区域 -->
        <div id="loginSection" class="card">
            <div class="card-header">
                <div class="card-title">🔐 管理员登录</div>
            </div>
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">登录</button>
            <div id="loginMessage"></div>
        </div>

        <!-- 设置管理区域 -->
        <div id="settingsSection" class="hidden">
            <div id="messageArea"></div>

            <!-- 当前状态 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📊 服务器状态</div>
                    <span id="serverStatus" class="status-badge status-offline">未连接</span>
                </div>
                <div id="currentConfig" class="loading">
                    <span class="spinner">⏳</span> 加载中...
                </div>
            </div>

            <!-- 存储配置 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">💾 存储配置</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">存储类型</label>
                    <select id="storageType" class="form-select">
                        <option value="local">本地存储 (Local)</option>
                        <option value="qiniu">七牛云 (Qiniu)</option>
                        <option value="hybrid">混合模式 (Hybrid) - 推荐</option>
                    </select>
                    <div class="form-hint">
                        • 本地：仅存储在服务器<br>
                        • 七牛云：直接上传到云端<br>
                        • 混合：本地存储 + 大文件自动备份云端
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">备份阈值（字节）</label>
                    <input type="number" id="backupThreshold" class="form-input" value="10485760" placeholder="10485760">
                    <div class="form-hint">混合模式下，大于此大小的文件会自动备份到云端（默认10MB）</div>
                </div>

                <div class="form-group">
                    <label class="form-label">最大文件大小（字节）</label>
                    <input type="number" id="maxFileSize" class="form-input" value="104857600" placeholder="104857600">
                    <div class="form-hint">允许上传的最大文件大小（默认100MB）</div>
                </div>

                <!-- 七牛云配置 -->
                <div id="qiniuConfigSection" style="border-top: 2px solid #f3f4f6; padding-top: 20px; margin-top: 20px;">
                    <h3 style="margin-bottom: 15px; color: #1f2937; font-size: 1.1em;">☁️ 七牛云配置</h3>
                    <div class="form-hint" style="margin-bottom: 15px; color: #6b7280;">
                        使用七牛云或混合模式时需要配置以下信息
                    </div>

                    <div class="form-group">
                        <label class="form-label">Access Key</label>
                        <input type="text" id="qiniuAccessKey" class="form-input" placeholder="请输入七牛云 Access Key">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Secret Key</label>
                        <input type="password" id="qiniuSecretKey" class="form-input" placeholder="请输入七牛云 Secret Key">
                    </div>

                    <div class="form-group">
                        <label class="form-label">存储空间名称 (Bucket)</label>
                        <input type="text" id="qiniuBucket" class="form-input" placeholder="请输入 Bucket 名称">
                    </div>

                    <div class="form-group">
                        <label class="form-label">CDN 域名 (可选)</label>
                        <input type="text" id="qiniuDomain" class="form-input" placeholder="http://your-cdn-domain.com">
                        <div class="form-hint">
                            七牛云绑定的CDN域名，用于访问文件<br>
                            <strong>可选</strong>：不填写则文件仅从本地访问，无CDN加速
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">存储区域</label>
                        <select id="qiniuZone" class="form-select">
                            <option value="Zone_z0">华东 (Zone_z0)</option>
                            <option value="Zone_z1">华北 (Zone_z1)</option>
                            <option value="Zone_z2">华南 (Zone_z2)</option>
                            <option value="Zone_na0">北美 (Zone_na0)</option>
                            <option value="Zone_as0">东南亚 (Zone_as0)</option>
                        </select>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="loadConfig()">🔄 重新加载</button>
                    <button class="btn btn-success" onclick="saveConfig()">💾 保存配置</button>
                    <button class="btn btn-danger" onclick="restartServer()">🔄 重启服务器</button>
                </div>
            </div>

            <!-- 操作日志 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📝 操作日志</div>
                    <button class="btn" style="padding: 6px 12px; font-size: 0.9em;" onclick="clearLog()">清空</button>
                </div>
                <div id="logArea" style="max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.9em; background: #f9fafb; padding: 15px; border-radius: 8px;">
                    <div style="color: #6b7280;">等待操作...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('adminToken') || '';
        
        // 初始化
        if (token) {
            showSettings();
            loadConfig();
        }

        function log(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString();
            const colors = {
                info: '#3b82f6',
                success: '#10b981',
                error: '#ef4444',
                warning: '#f59e0b'
            };
            const color = colors[type] || colors.info;
            
            const logEntry = document.createElement('div');
            logEntry.style.color = color;
            logEntry.style.marginBottom = '5px';
            logEntry.textContent = `[${time}] ${message}`;
            
            logArea.appendChild(logEntry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logArea').innerHTML = '<div style="color: #6b7280;">日志已清空</div>';
        }

        function showMessage(message, type = 'info') {
            const messageArea = document.getElementById('messageArea');
            const alertClass = `alert-${type}`;
            messageArea.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }

        function showSettings() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('settingsSection').classList.remove('hidden');
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                log('正在登录...', 'info');
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    token = data.data.token;
                    localStorage.setItem('adminToken', token);
                    log('✓ 登录成功', 'success');
                    showSettings();
                    loadConfig();
                } else {
                    log('✗ 登录失败: ' + data.error, 'error');
                    document.getElementById('loginMessage').innerHTML = 
                        `<div class="alert alert-error" style="margin-top: 15px;">${data.error}</div>`;
                }
            } catch (error) {
                log('✗ 登录请求失败: ' + error.message, 'error');
                document.getElementById('loginMessage').innerHTML = 
                    `<div class="alert alert-error" style="margin-top: 15px;">网络错误</div>`;
            }
        }

        async function loadConfig() {
            if (!token) {
                showMessage('请先登录', 'error');
                return;
            }

            try {
                log('正在加载配置...', 'info');
                const response = await fetch('/api/settings/storage', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const config = data.data;
                    
                    // 更新表单
                    document.getElementById('storageType').value = config.storageType;
                    document.getElementById('backupThreshold').value = config.backupThreshold;
                    document.getElementById('maxFileSize').value = config.maxFileSize;
                    
                    // 更新七牛云配置（显示隐藏的密钥）
                    if (config.qiniuAccessKey && config.qiniuAccessKey.startsWith('***')) {
                        document.getElementById('qiniuAccessKey').placeholder = config.qiniuAccessKey;
                    } else {
                        document.getElementById('qiniuAccessKey').value = config.qiniuAccessKey || '';
                    }
                    
                    if (config.qiniuSecretKey && config.qiniuSecretKey.startsWith('***')) {
                        document.getElementById('qiniuSecretKey').placeholder = config.qiniuSecretKey;
                    } else {
                        document.getElementById('qiniuSecretKey').value = config.qiniuSecretKey || '';
                    }
                    
                    document.getElementById('qiniuBucket').value = config.qiniuBucket || '';
                    document.getElementById('qiniuDomain').value = config.qiniuDomain || '';
                    document.getElementById('qiniuZone').value = config.qiniuZone || 'Zone_z2';
                    
                    // 显示当前配置
                    document.getElementById('currentConfig').innerHTML = `
                        <div class="metric-row">
                            <span>存储类型</span>
                            <strong>${config.storageType}</strong>
                        </div>
                        <div class="metric-row">
                            <span>备份阈值</span>
                            <strong>${(config.backupThreshold / 1024 / 1024).toFixed(2)} MB</strong>
                        </div>
                        <div class="metric-row">
                            <span>最大文件</span>
                            <strong>${(config.maxFileSize / 1024 / 1024).toFixed(0)} MB</strong>
                        </div>
                        <div class="metric-row">
                            <span>上传目录</span>
                            <strong>${config.uploadDir}</strong>
                        </div>
                    `;
                    
                    document.getElementById('serverStatus').className = 'status-badge status-online';
                    document.getElementById('serverStatus').textContent = '● 已连接';
                    
                    log('✓ 配置加载成功', 'success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                log('✗ 加载配置失败: ' + error.message, 'error');
                document.getElementById('currentConfig').innerHTML = 
                    `<div class="alert alert-error">无法加载配置</div>`;
                document.getElementById('serverStatus').className = 'status-badge status-offline';
                document.getElementById('serverStatus').textContent = '● 断开连接';
            }
        }

        async function saveConfig() {
            if (!token) {
                showMessage('请先登录', 'error');
                return;
            }

            const config = {
                storageType: document.getElementById('storageType').value,
                backupThreshold: parseInt(document.getElementById('backupThreshold').value),
                maxFileSize: parseInt(document.getElementById('maxFileSize').value)
            };

            // 添加七牛云配置（如果有填写）
            const qiniuAccessKey = document.getElementById('qiniuAccessKey').value;
            const qiniuSecretKey = document.getElementById('qiniuSecretKey').value;
            const qiniuBucket = document.getElementById('qiniuBucket').value;
            const qiniuDomain = document.getElementById('qiniuDomain').value;
            const qiniuZone = document.getElementById('qiniuZone').value;

            if (qiniuAccessKey) config.qiniuAccessKey = qiniuAccessKey;
            if (qiniuSecretKey) config.qiniuSecretKey = qiniuSecretKey;
            if (qiniuBucket) config.qiniuBucket = qiniuBucket;
            if (qiniuDomain) config.qiniuDomain = qiniuDomain;
            if (qiniuZone) config.qiniuZone = qiniuZone;

            // 验证：如果使用七牛云或混合模式，必须填写七牛云配置
            if ((config.storageType === 'qiniu' || config.storageType === 'hybrid')) {
                if (!qiniuAccessKey || !qiniuSecretKey || !qiniuBucket) {
                    showMessage('使用七牛云或混合模式时，必须填写 AccessKey、SecretKey 和 Bucket', 'error');
                    log('✗ 七牛云配置不完整', 'error');
                    return;
                }
                if (!qiniuDomain) {
                    log('⚠️ 未填写CDN域名，文件将只能从本地访问', 'warning');
                }
            }

            if (!config.storageType || !config.backupThreshold || !config.maxFileSize) {
                showMessage('请填写所有必填字段', 'error');
                return;
            }

            try {
                log('正在保存配置...', 'info');
                const response = await fetch('/api/settings/storage', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('✅ 配置已保存到 .env 文件！点击"重启服务器"使配置生效', 'success');
                    log('✓ 配置保存成功（已写入 .env 文件）', 'success');
                    log('📁 保存位置：项目根目录/.env', 'info');
                    log('⚠️ 重要：点击"重启服务器"按钮使配置完全生效', 'warning');
                    loadConfig(); // 重新加载显示
                } else {
                    showMessage('✗ 保存失败: ' + data.error, 'error');
                    log('✗ 保存失败: ' + data.error, 'error');
                }
            } catch (error) {
                showMessage('✗ 保存失败: ' + error.message, 'error');
                log('✗ 保存请求失败: ' + error.message, 'error');
            }
        }

        async function restartServer() {
            if (!token) {
                showMessage('请先登录', 'error');
                return;
            }

            if (!confirm('⚠️ 确定要重启服务器吗？\n\n重启会断开所有连接，大约需要5-10秒恢复。')) {
                return;
            }

            try {
                log('🔄 正在发送重启请求...', 'warning');
                showMessage('🔄 服务器正在重启，请稍候...', 'warning');
                
                const response = await fetch('/api/settings/restart', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('✓ 重启命令已发送', 'success');
                    log('⏳ 等待服务器重启（约6秒）...', 'info');
                    showMessage('🔄 服务器正在重启，请等待约6秒...', 'info');
                    
                    // 等待6秒
                    await new Promise(resolve => setTimeout(resolve, 6000));
                    
                    // 检查服务器状态
                    log('🔍 检查服务器状态...', 'info');
                    try {
                        const healthCheck = await fetch('/health');
                        if (healthCheck.ok) {
                            log('✓ 服务器重启成功！', 'success');
                            showMessage('✅ 服务器已成功重启！配置已生效。', 'success');
                            loadConfig(); // 重新加载配置
                        } else {
                            throw new Error('服务器响应异常');
                        }
                    } catch (error) {
                        log('⏳ 服务器仍在启动中，请稍后手动刷新', 'warning');
                        showMessage('⏳ 服务器仍在启动中，请稍后刷新页面', 'warning');
                    }
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                if (error.message === 'Failed to fetch') {
                    log('⏳ 服务器正在重启中...', 'warning');
                    showMessage('🔄 服务器正在重启，请等待约10秒后刷新页面', 'warning');
                } else {
                    log('✗ 重启失败: ' + error.message, 'error');
                    showMessage('✗ 重启失败: ' + error.message, 'error');
                }
            }
        }
    </script>
</body>
</html>
